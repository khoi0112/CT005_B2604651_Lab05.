<!DOCTYPE html>
<html lang="vi">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Lợi ích của công nghệ số</title>
	<style>
		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			padding: 32px 16px;
			background: #f3f7f5;
			color: #20312b;
			font-family: Arial, sans-serif;
			line-height: 1.6;
		}

		main {
			width: min(100%, 900px);
			margin: 0 auto;
		}

		h1 {
			margin: 0 0 12px;
			color: #176b52;
			font-size: clamp(1.8rem, 5vw, 2.6rem);
			line-height: 1.2;
			text-align: center;
		}

		p {
			margin: 0 auto 24px;
			max-width: 70ch;
			text-align: center;
		}

		img {
			display: block;
			width: 100%;
			height: auto;
			margin: 0 auto 24px;
			border-radius: 8px;
		}

		.video {
			position: relative;
			width: 100%;
			aspect-ratio: 16 / 9;
			overflow: hidden;
			border-radius: 8px;
			background: #dce7e1;
		}

		iframe {
			position: absolute;
			inset: 0;
			width: 100%;
			height: 100%;
			border: 0;
		}

		footer {
			margin-top: 16px;
			color: #52635c;
			font-size: 0.9rem;
			text-align: center;
		}
	</style>
</head>
<body>
	<main>
		<h1>Lợi ích của công nghệ số</h1>
		<p>Công nghệ số giúp kết nối mọi người, tiếp cận kiến thức nhanh chóng và làm việc, học tập hiệu quả hơn. Những công cụ số còn hỗ trợ sáng tạo và mở ra nhiều cơ hội mới trong cuộc sống.</p>

		<img src="Lab05_Ex2.1.png" alt="Infographic về lợi ích của công nghệ số">

		<div class="video">
			<iframe
    src="https://www.youtube.com/embed/2c-pFNCNNwc"
    title="Video về lợi ích của công nghệ số"
    allowfullscreen>
</iframe>
		</div>

		<footer>Video tạo bởi CapCut, tài liệu từ Pexels/FreeSound (CC0).</footer>
	</main>
</body>
</html>
